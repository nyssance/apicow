[package]
name = "yaak-app-client"
version = "0.0.0"
edition = "2024"
authors = ["Gregory Schier"]
publish = false

# Produce a library for mobile support
[lib]
name = "tauri_app_client_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[features]
cargo-clippy = []
hasgard-testing = ["wry", "dep:tauri-plugin-hasgard"]
default = []
cef = ["dep:tauri-runtime-cef", "tauri-plugin-dialog/xdg-portal"]
wry = ["dep:tauri-runtime-wry", "tauri-plugin-dialog/gtk3"]
updater = []
license = ["yaak-license"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl-sys = { version = "0.9.117", features = ["vendored"] } # For Ubuntu installation to work

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rlimit = "0.11" # Raise the launchd 256 open-file soft limit at startup

[dependencies]
base64 = "0.23.1" # For writing values the editor only ever held encoded
charset = "0.1.5"
chrono = { workspace = true, features = ["serde"] }
cookie = "0.18.2"
eventsource-client = { git = "https://github.com/yaakapp/rust-eventsource-client", version = "0.14.0" }
http = { version = "1.5.0", default-features = false }
log = { workspace = true }
md5 = "0.8.1"
notify = "8.2.1"
pretty_graphql = "0.2"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35"
mime_guess = "2.0.5"
rand = "0.10.3"
reqwest = { workspace = true, features = [
  "multipart",
  "gzip",
  "brotli",
  "deflate",
  "json",
  "query",
  "rustls-no-provider",
  "socks",
  "http2",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
tauri = { workspace = true, features = ["devtools", "protocol-asset"] }
tauri-plugin-clipboard-manager = "3.0.0-alpha.3"
tauri-plugin-deep-link = "3.0.0-alpha.3"
tauri-plugin-dialog = { workspace = true }
tauri-plugin-hasgard = { version = "0.6", optional = true }
tauri-plugin-fs = "3.0.0-alpha.3"
tauri-plugin-log = { version = "3.0.0-alpha.3", features = ["colored"] }
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-os = "3.0.0-alpha.3"
tauri-plugin-shell = { workspace = true }
tauri-plugin-single-instance = { version = "3.0.0-alpha.3", features = ["deep-link"] }
tauri-plugin-updater = "3.0.0-alpha.3"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-stream = "0.1.19"
tokio-tungstenite = { version = "0.30.0", default-features = false }
url = "2"
tokio-util = { version = "0.7", features = ["codec"] }
ts-rs = { workspace = true }
yaak-rpc = { workspace = true }
yaak-rpc-schema = { workspace = true }
uuid = "1.29.0"
yaak-api = { workspace = true }
yaak-common = { workspace = true }
yaak-tauri-utils = { workspace = true }
yaak-core = { workspace = true }
yaak = { workspace = true }
yaak-commands = { workspace = true }
yaak-crypto = { workspace = true }
yaak-filter = { workspace = true }
yaak-fonts = { workspace = true }
yaak-git = { workspace = true }
yaak-grpc = { workspace = true }
yaak-http = { workspace = true }
yaak-license = { workspace = true, optional = true }
yaak-mac-window = { workspace = true }
yaak-lifecycle = { workspace = true }
yaak-mcp = { workspace = true }
yaak-models = { workspace = true }
yaak-plugins = { workspace = true }
yaak-sse = { workspace = true }
yaak-system-appearance = { workspace = true }
yaak-sync = { workspace = true }
yaak-templates = { workspace = true }
yaak-tls = { workspace = true }
yaak-window = { workspace = true }
yaak-ws = { workspace = true }

[dependencies.tauri-runtime-wry]
version = "3.0.0-alpha.5"
optional = true

[dependencies.tauri-runtime-cef]
version = "3.0.0-alpha.6"
optional = true
