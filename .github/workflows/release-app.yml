# 照 GitCub 的发布流程：手动运行只出未签名的安装包当工件；推 v* 标签则签名、公证、
# 生成更新器元数据并在公开仓 nyssance/releases 建草稿 Release `apicow-v*`（源码仓保持私有），
# 人工检查发布后再把 latest.json 覆盖到固定的 `apicow-latest` Release，更新器只读那里。
# 版本号沿用上游做法由标签提供：构建前 `npm run replace-version` 把 v* 写进 tauri.conf.json。
# 目前只出 macOS（Apple Silicon）；Windows / Linux 不列入发布矩阵。
name: release

on:
  workflow_dispatch:
    inputs:
      publish_latest:
        description: 已发布的版本标签（如 v0.1.0）：把它的 latest.json 覆盖到 apicow-latest
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test-bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_latest == ''
    permissions:
      contents: read
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
      - run: vp install
      - run: npm run bootstrap
        env:
          YAAK_TARGET_ARCH: arm64
      - uses: tauri-apps/tauri-action@v1
        env:
          YAAK_TARGET_ARCH: arm64
        with:
          tauriScript: node ../../node_modules/@tauri-apps/cli/tauri.js
          projectPath: ./crates-tauri/yaak-app-client
          args: --target aarch64-apple-darwin --config ./tauri.release.conf.json --config '{"bundle":{"createUpdaterArtifacts":false}}'
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: apicow-[version]-[platform]-[arch]-[bundle]

  release-preflight:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.prepare-release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: 标签是合法版本号，且配置里是占位版本
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag $RELEASE_TAG is not v<semver>" >&2
            exit 1
          fi
          # 版本号由标签经 replace-version 写入；仓库里只允许占位 0.0.0 或与标签相同的值
          version=$(jq -r '.version' crates-tauri/yaak-app-client/tauri.conf.json)
          if [[ "$version" != "0.0.0" && "v$version" != "$RELEASE_TAG" ]]; then
            echo "tauri.conf.json version $version is neither the 0.0.0 placeholder nor $RELEASE_TAG" >&2
            exit 1
          fi
      - name: 签名与公证密钥齐全
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID \
            APPLE_PASSWORD APPLE_TEAM_ID TAURI_PRIVATE_KEY TAURI_KEY_PASSWORD RELEASE_TOKEN; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "Missing release secrets: ${missing[*]}" >&2
            exit 1
          fi
      - name: 准备公开仓的草稿 Release
        id: prepare-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: apicow-${{ github.ref_name }}
          RELEASE_REPO: nyssance/releases
        run: |
          set -euo pipefail
          releases=$(gh api --paginate "repos/$RELEASE_REPO/releases" |
            jq -s --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]')
          count=$(jq 'length' <<< "$releases")
          if [ "$count" -eq 0 ]; then
            release_id=$(gh api --method POST "repos/$RELEASE_REPO/releases" \
              -f tag_name="$RELEASE_TAG" -f target_commitish=main -f name="ApiCow ${RELEASE_TAG#apicow-}" \
              -F draft=true --jq '.id')
          elif [ "$count" -eq 1 ]; then
            release_id=$(jq -er '.[0] | if .draft then .id else error("Release is already published") end' <<< "$releases")
          else
            echo "Multiple releases exist for $RELEASE_TAG" >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-preflight
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
      - run: vp install
      - run: npm run bootstrap
        env:
          YAAK_TARGET_ARCH: arm64
      - name: 把标签写进 tauri.conf.json 的版本号
        run: npm run replace-version
        env:
          YAAK_VERSION: ${{ github.ref_name }}
      - name: 导入 Apple 签名证书
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash scripts/macos-signing.sh setup
      # beforeBundleCommand（scripts/sign-vendored-binaries.mjs）用 APPLE_SIGNING_IDENTITY 给
      # vendored 的 yaaknode / yaakprotoc 签 hardened runtime，Tauri 再签 .app 并公证
      - uses: tauri-apps/tauri-action@v1
        env:
          YAAK_TARGET_ARCH: arm64
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tauriScript: node ../../node_modules/@tauri-apps/cli/tauri.js
          projectPath: ./crates-tauri/yaak-app-client
          owner: nyssance
          repo: releases
          tagName: apicow-${{ github.ref_name }}
          releaseId: ${{ needs.release-preflight.outputs.release_id }}
          releaseName: ApiCow ${{ github.ref_name }}
          releaseDraft: true
          releaseAssetNamePattern: apicow_[version]_[platform]_[arch][ext]
          args: --target aarch64-apple-darwin --config ./tauri.release.conf.json
      - name: 公证并盖章 DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: apicow-${{ github.ref_name }}
        run: |
          set -euo pipefail
          dmg=$(ls target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          cp "$dmg" "apicow_${GITHUB_REF_NAME#v}_macos_aarch64.dmg"
          gh release upload "$RELEASE_TAG" "apicow_${GITHUB_REF_NAME#v}_macos_aarch64.dmg" --repo nyssance/releases --clobber
      - name: 清理签名钥匙串
        if: always() && env.APICOW_SIGNING_DIR != ''
        shell: bash
        run: bash scripts/macos-signing.sh cleanup

  # 发布草稿后手动运行：把该版本的 latest.json 覆盖到固定的 apicow-latest Release，更新器才看到新版本。
  publish-latest:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_latest != ''
    runs-on: ubuntu-24.04
    steps:
      - name: 复制 latest.json 到 apicow-latest
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION_TAG: apicow-${{ inputs.publish_latest }}
        run: |
          set -euo pipefail
          gh release download "$VERSION_TAG" --repo nyssance/releases --pattern latest.json
          # 草稿期上传的清单里是 API 资源地址，更新器不带 Accept 头下不到；改成发布后的直链
          python3 - "$VERSION_TAG" <<'PY'
          import json, sys
          tag = sys.argv[1]
          manifest = json.load(open("latest.json"))
          for platform in manifest["platforms"].values():
              name = platform["url"].rsplit("/", 1)[-1]
              if not name.endswith(".app.tar.gz"):
                  name = f"apicow_{manifest['version']}_darwin_aarch64.app.tar.gz"
              platform["url"] = f"https://github.com/nyssance/releases/releases/download/{tag}/{name}"
          json.dump(manifest, open("latest.json", "w"), indent=2)
          PY
          gh release upload "$VERSION_TAG" latest.json --repo nyssance/releases --clobber
          gh release view apicow-latest --repo nyssance/releases >/dev/null 2>&1 ||
            gh release create apicow-latest --repo nyssance/releases --title "ApiCow 更新清单" --notes "应用内更新器读取的 latest.json，始终指向最新发布版本。" --latest=false
          gh release upload apicow-latest latest.json --repo nyssance/releases --clobber
