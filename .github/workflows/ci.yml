on:
  pull_request:
  push:
    branches:
      - main

name: Lint and Test
permissions:
  contents: read

jobs:
  test:
    name: Lint/Test
    runs-on: macos-26
    env:
      SKIP_WASM_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true

      - run: bun install --frozen-lockfile
      - run: bun run bootstrap
      - run: bun run lint
      - name: Run JS Tests
        run: bun x --no-install vp test run --maxWorkers=4
      - name: Run Rust Tests
        run: cargo test --all --features yaak-app-client/wry
      - name: OpenAPI import round-trip
        run: |
          cargo build -p yaak-cli
          node plugins/importer-openapi/tests/roundtrip.mjs

  test-windows:
    name: Rust Tests (Windows)
    runs-on: windows-2025
    env:
      SKIP_WASM_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
      - name: Install Protoc for plugin-runtime
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: bun install --frozen-lockfile
      - run: bun run bootstrap
        env:
          YAAK_TARGET_ARCH: x64
      - name: Run Rust Tests
        run: cargo test --all --exclude yaak-cli --features yaak-app-client/wry
